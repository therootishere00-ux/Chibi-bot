<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chibeki Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FFD951;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        .bot-name {
            color: white;
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 15px;
            position: absolute;
            top: calc(50% - 120px);
        }

        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 40px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }

        .loading-progress {
            position: absolute;
            height: 100%;
            width: 0%;
            background-color: white;
            border-radius: 2px;
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            color: white;
            opacity: 0.7;
            font-size: 14px;
        }

        .main-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 5;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .user-avatar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 17px;
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
        }

        .main-logo {
            width: 120px;
            height: auto;
            margin-top: 80px;
            align-self: center;
        }

        .subtitle {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .item-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            width: calc(100% - 20px);
            box-sizing: border-box;
            margin-left: 10px;
            margin-right: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .item-card:active {
            background-color: #2a2a2a;
        }

        .item-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .item-chevron {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }

        .article-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            width: calc(100% - 20px);
            box-sizing: border-box;
            margin-left: 10px;
            margin-right: 10px;
            position: relative;
        }

        .article-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            flex: 1;
        }

        .article-link {
            color: #FFD951;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid #FFD951;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .article-link:hover {
            background-color: #FFD951;
            color: #000;
        }

        .collection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 8;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .back-button {
            color: white;
            font-size: 20px;
            margin-right: 15px;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }

        .back-button:active {
            background-color: #2a2a2a;
        }

        .header-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .chibi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 5px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .chibi-card {
            background-color: #1a1a1a;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            aspect-ratio: 1;
            position: relative;
            transition: transform 0.2s ease;
        }

        .chibi-card:active {
            transform: scale(0.95);
        }

        .chibi-image {
            width: 100%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .chibi-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .chibi-name {
            color: white;
            font-size: 10px;
            text-align: center;
            font-weight: 500;
            line-height: 1.2;
            margin-top: 4px;
        }

        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lock-icon {
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            margin-bottom: 5px;
        }

        .locked-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="bot-name">@chibeki_bot</div>
        
        <img src="https://i.ibb.co/zTB331HR/image.png" alt="Логотип" class="logo">
        
        <div class="loading-bar">
            <div class="loading-progress" id="progress"></div>
        </div>

        <div class="footer-text">Загрузка коллекции...</div>
    </div>

    <div class="main-screen" id="mainScreen">
        <div class="user-avatar" id="userAvatar">
            TG
        </div>
        
        <img src="https://i.ibb.co/zTB331HR/image.png" alt="Логотип" class="main-logo">
        
        <div class="subtitle">Чибики</div>
        
        <div class="item-card" id="commonChibisBtn">
            <div class="item-image" id="commonChibiImage">
                <img src="" alt="Обычные чибики" id="commonChibiImg">
            </div>
            <div class="item-content">
                <div class="item-title">Обычные</div>
            </div>
            <div class="item-chevron">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="item-card" id="secretChibisBtn">
            <div class="item-image" id="secretChibiImage">
                <i class="fas fa-question" id="secretChibiIcon"></i>
                <img src="" alt="Секретные чибики" id="secretChibiImg" style="display: none;">
            </div>
            <div class="item-content">
                <div class="item-title" id="secretChibiTitle">???</div>
            </div>
            <div class="item-chevron">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="subtitle">Статьи</div>
        
        <div class="article-card">
            <div class="article-image">
                <img src="https://i.ibb.co/sJVz9tH3/IMG-6876.png" alt="Статья">
            </div>
            <div class="article-title">Как работают кости?</div>
            <a href="https://example.com" target="_blank" class="article-link">Читать</a>
        </div>
    </div>

    <div class="collection-screen hidden" id="commonCollectionScreen">
        <div class="header">
            <div class="back-button" id="backButton">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="header-title">Обычные чибики</div>
        </div>
        
        <div class="chibi-grid" id="commonChibiGrid">
        </div>
    </div>

    <script>
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });
        
        const progressBar = document.getElementById('progress');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainScreen = document.getElementById('mainScreen');
        const userAvatar = document.getElementById('userAvatar');
        const commonChibisBtn = document.getElementById('commonChibisBtn');
        const commonCollectionScreen = document.getElementById('commonCollectionScreen');
        const backButton = document.getElementById('backButton');
        const commonChibiGrid = document.getElementById('commonChibiGrid');
        const commonChibiImg = document.getElementById('commonChibiImg');
        const secretChibisBtn = document.getElementById('secretChibisBtn');
        const secretChibiImage = document.getElementById('secretChibiImage');
        const secretChibiIcon = document.getElementById('secretChibiIcon');
        const secretChibiImg = document.getElementById('secretChibiImg');
        const secretChibiTitle = document.getElementById('secretChibiTitle');
        
        let userData = {
            common_collected: [],
            secret_collected: [],
            all_common: [],
            all_secret: [],
            user_name: 'Путешественник'
        };
        
        const urlParams = new URLSearchParams(window.location.search);
        const telegramId = urlParams.get('telegram_id');
        
        function initTelegramUser() {
            if (window.Telegram && window.Telegram.WebApp) {
                const user = Telegram.WebApp.initDataUnsafe.user;
                if (user && user.photo_url) {
                    userAvatar.innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:17px;">`;
                } else {
                    userAvatar.innerHTML = 'TG';
                }
                
                if (user) {
                    document.title = `Коллекция ${user.first_name || 'путешественника'}`;
                }
            } else {
                userAvatar.innerHTML = '<img src="https://via.placeholder.com/50/333/fff?text=TG" style="width:100%;height:100%;object-fit:cover;border-radius:17px;">';
            }
        }
        
        async function loadUserData() {
            if (!telegramId) {
                console.error("No telegram_id in URL");
                return;
            }
            
            try {
                const response = await fetch(`/api/user/${telegramId}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                userData = data;
                updateMainScreen();
            } catch (error) {
                console.error('Error loading user data:', error);
                
                const botUrl = window.location.hostname.includes('github.io') 
                    ? 'https://your-bot-url.onrender.com' 
                    : '';
                
                if (botUrl) {
                    try {
                        const response = await fetch(`${botUrl}/api/user/${telegramId}`);
                        const data = await response.json();
                        userData = data;
                        updateMainScreen();
                    } catch (secondError) {
                        console.error('Second attempt failed:', secondError);
                    }
                }
            }
        }
        
        function updateMainScreen() {
            if (userData.common_collected.length > 0) {
                const randomCommonChibi = userData.common_collected[Math.floor(Math.random() * userData.common_collected.length)];
                const imageUrl = `chibis/common/${randomCommonChibi}.png`;
                commonChibiImg.src = imageUrl;
                commonChibiImg.onerror = function() {
                    commonChibiImg.src = 'https://via.placeholder.com/50/333/fff?text=?';
                };
            } else {
                commonChibiImg.src = 'https://via.placeholder.com/50/333/fff?text=?';
            }
            
            if (userData.secret_collected.length > 0) {
                const firstSecretChibi = userData.secret_collected[0];
                const imageUrl = `chibis/secret/${firstSecretChibi}.png`;
                secretChibiIcon.style.display = 'none';
                secretChibiImg.src = imageUrl;
                secretChibiImg.style.display = 'block';
                secretChibiImg.onerror = function() {
                    secretChibiIcon.style.display = 'block';
                    secretChibiImg.style.display = 'none';
                };
                secretChibiTitle.textContent = 'Секретные';
            } else {
                secretChibiIcon.style.display = 'block';
                secretChibiImg.style.display = 'none';
                secretChibiTitle.textContent = '???';
            }
        }
        
        function createChibiCard(chibiName, isCollected) {
            const card = document.createElement('div');
            card.className = 'chibi-card';
            
            const imageUrl = `chibis/common/${chibiName}.png`;
            
            card.innerHTML = `
                <div class="chibi-image">
                    <img src="${imageUrl}" alt="${chibiName}" style="opacity: ${isCollected ? '1' : '0.3'}">
                </div>
                <div class="chibi-name">${chibiName}</div>
                ${!isCollected ? `
                    <div class="locked-overlay">
                        <div class="lock-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="locked-text">Не получен</div>
                    </div>
                ` : ''}
            `;
            
            card.querySelector('img').onerror = function() {
                this.src = 'https://via.placeholder.com/100/333/fff?text=?';
            };
            
            return card;
        }
        
        function loadCommonCollection() {
            commonChibiGrid.innerHTML = '';
            
            userData.all_common.forEach(chibiName => {
                const isCollected = userData.common_collected.includes(chibiName);
                const chibiCard = createChibiCard(chibiName, isCollected);
                commonChibiGrid.appendChild(chibiCard);
            });
        }
        
        commonChibisBtn.addEventListener('click', function() {
            mainScreen.classList.add('hidden');
            commonCollectionScreen.classList.remove('hidden');
            commonCollectionScreen.style.opacity = '1';
            loadCommonCollection();
        });
        
        backButton.addEventListener('click', function() {
            commonCollectionScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            mainScreen.style.opacity = '1';
        });
        
        function simulateRealisticLoading() {
            const speed = 0.5 + Math.random() * 1.5;
            const shouldLag = Math.random() < 0.2;
            const lagDuration = shouldLag ? 300 + Math.random() * 700 : 0;
            
            if (shouldLag && progress > 20 && progress < 90) {
                setTimeout(() => {
                    progress += speed;
                    progressBar.style.width = progress + '%';
                    
                    if (progress < 100) {
                        setTimeout(simulateRealisticLoading, 50);
                    } else {
                        finishLoading();
                    }
                }, lagDuration);
            } else {
                progress += speed;
                progressBar.style.width = progress + '%';
                
                if (progress < 100) {
                    setTimeout(simulateRealisticLoading, 50);
                } else {
                    finishLoading();
                }
            }
        }
        
        function finishLoading() {
            loadingScreen.style.opacity = '0';
            
            setTimeout(() => {
                mainScreen.style.opacity = '1';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 800);
            }, 500);
        }
        
        let progress = 0;
        window.onload = function() {
            initTelegramUser();
            loadUserData();
            setTimeout(simulateRealisticLoading, 500);
        };
    </script>
</body>
</html>
