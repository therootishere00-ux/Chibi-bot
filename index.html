<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chibeki Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FFD951;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        .bot-name {
            color: white;
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 15px;
            position: absolute;
            top: calc(50% - 120px);
        }

        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 40px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }

        .loading-progress {
            position: absolute;
            height: 100%;
            width: 0%;
            background-color: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            color: white;
            opacity: 0.7;
            font-size: 14px;
        }

        .main-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 5;
            padding: 20px;
            padding-top: 105px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 85px;
            left: 20px;
            right: 20px;
            z-index: 6;
        }

        .main-logo {
            width: 120px;
            height: auto;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 17px;
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
        }

        .subtitle {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .item-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .item-card:active {
            background-color: #2a2a2a;
            transform: scale(0.98);
        }

        .item-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .article-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .article-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            flex: 1;
        }

        .article-link {
            color: #FFD951;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid #FFD951;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .article-link:active {
            background-color: #FFD951;
            color: #000;
        }

        .collection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 8;
            padding: 20px;
            padding-top: 105px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .header-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .chibi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .chibi-card {
            background-color: #1a1a1a;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            aspect-ratio: 1;
            position: relative;
            transition: transform 0.2s ease;
        }

        .chibi-card:active {
            transform: scale(0.95);
        }

        .chibi-image {
            width: 100%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .chibi-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .chibi-name {
            color: white;
            font-size: 10px;
            text-align: center;
            font-weight: 500;
            line-height: 1.2;
            margin-top: 4px;
        }

        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lock-icon {
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            margin-bottom: 5px;
        }

        .locked-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="bot-name">@chibeki_bot</div>
        <img src="https://i.ibb.co/zTB331HR/image.png" alt="Логотип" class="logo">
        <div class="loading-bar">
            <div class="loading-progress" id="progress"></div>
        </div>
        <div class="footer-text">Загрузка коллекции...</div>
    </div>

    <div class="main-screen" id="mainScreen">
        <div class="header-container">
            <img src="https://i.ibb.co/zTB331HR/image.png" alt="Логотип" class="main-logo">
            <div class="user-avatar" id="userAvatar">
                TG
            </div>
        </div>
        
        <div class="subtitle">Чибики</div>
        
        <div class="item-card" id="commonChibisBtn">
            <div class="item-image">
                <img src="" alt="Обычные чибики" id="commonChibiImage">
            </div>
            <div class="item-content">
                <div class="item-title">Обычные</div>
            </div>
        </div>
        
        <div class="item-card" id="secretChibisBtn">
            <div class="item-image">
                <img src="" alt="Секретные чибики" id="secretChibiImage">
            </div>
            <div class="item-content">
                <div class="item-title" id="secretTitle">???</div>
            </div>
        </div>
        
        <div class="subtitle">Статьи</div>
        
        <div class="article-card">
            <div class="article-image">
                <img src="https://i.ibb.co/sJVz9tH3/IMG-6876.png" alt="Статья">
            </div>
            <div class="article-title">Как работают кости?</div>
            <a href="https://example.com" target="_blank" class="article-link">Читать</a>
        </div>
    </div>

    <div class="collection-screen hidden" id="commonCollectionScreen">
        <div class="header">
            <div class="header-title">Обычные чибики</div>
        </div>
        
        <div class="chibi-grid" id="commonChibiGrid">
        </div>
    </div>

    <div class="collection-screen hidden" id="secretCollectionScreen">
        <div class="header">
            <div class="header-title">Секретные чибики</div>
        </div>
        
        <div class="chibi-grid" id="secretChibiGrid">
        </div>
    </div>

    <script>
        const progressBar = document.getElementById('progress');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainScreen = document.getElementById('mainScreen');
        const userAvatar = document.getElementById('userAvatar');
        const commonChibisBtn = document.getElementById('commonChibisBtn');
        const secretChibisBtn = document.getElementById('secretChibisBtn');
        const commonCollectionScreen = document.getElementById('commonCollectionScreen');
        const secretCollectionScreen = document.getElementById('secretCollectionScreen');
        const commonChibiGrid = document.getElementById('commonChibiGrid');
        const secretChibiGrid = document.getElementById('secretChibiGrid');
        const commonChibiImage = document.getElementById('commonChibiImage');
        const secretChibiImage = document.getElementById('secretChibiImage');
        const secretTitle = document.getElementById('secretTitle');
        const articleLink = document.querySelector('.article-link');
        
        let userData = {
            collectedChibis: [],
            secretChibis: []
        };
        
        let allCommonChibis = [];
        let allSecretChibis = [];
        
        // Функция для легкой вибрации через Telegram Web App
        function vibrate() {
            if (window.Telegram && window.Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }
        
        // Функция для проверки времени последнего запуска
        function shouldShowLoading() {
            const lastLaunch = localStorage.getItem('lastLaunchTime');
            if (!lastLaunch) return true;
            
            const currentTime = Date.now();
            const timeDiff = currentTime - parseInt(lastLaunch);
            return timeDiff > 20000; // 20 секунд
        }
        
        // Функция для сохранения времени запуска
        function saveLaunchTime() {
            localStorage.setItem('lastLaunchTime', Date.now().toString());
        }
        
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.ready();
                
                const user = Telegram.WebApp.initDataUnsafe.user;
                if (user) {
                    if (user.photo_url) {
                        userAvatar.innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:17px;">`;
                    }
                    
                    Telegram.WebApp.setHeaderColor('#000000');
                    Telegram.WebApp.setBackgroundColor('#000000');
                    
                    Telegram.WebApp.BackButton.onClick(handleBackButton);
                }
                
                Telegram.WebApp.expand();
            }
        }
        
        function handleBackButton() {
            vibrate(); // Вибрация при нажатии назад
            if (!commonCollectionScreen.classList.contains('hidden')) {
                showMainScreen();
            } else if (!secretCollectionScreen.classList.contains('hidden')) {
                showMainScreen();
            }
        }
        
        function showMainScreen() {
            commonCollectionScreen.classList.add('hidden');
            secretCollectionScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            mainScreen.style.opacity = '1';
            
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.BackButton.hide();
            }
        }
        
        function showCollectionScreen(screen) {
            vibrate(); // Вибрация при переходе в коллекцию
            mainScreen.classList.add('hidden');
            screen.classList.remove('hidden');
            screen.style.opacity = '1';
            
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.BackButton.show();
            }
        }
        
        async function loadUserCollection() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const user = Telegram.WebApp.initDataUnsafe.user;
                    if (user) {
                        const response = await fetch('/get_user_collection', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ telegram_id: user.id })
                        });
                        
                        if (response.ok) {
                            const collection = await response.json();
                            userData.collectedChibis = collection.common || [];
                            userData.secretChibis = collection.secret || [];
                            updateMainScreenImages();
                        }
                    }
                }
            } catch (error) {
                console.error('Ошибка загрузки коллекции:', error);
            }
        }
        
        function updateMainScreenImages() {
            if (userData.collectedChibis.length > 0) {
                const randomCommon = userData.collectedChibis[Math.floor(Math.random() * userData.collectedChibis.length)];
                commonChibiImage.src = `https://raw.githubusercontent.com/your-repo/main/chibis/common/${randomCommon}.png`;
            }
            
            if (userData.secretChibis.length > 0) {
                const randomSecret = userData.secretChibis[Math.floor(Math.random() * userData.secretChibis.length)];
                secretChibiImage.src = `https://raw.githubusercontent.com/your-repo/main/chibis/secret/${randomSecret}.png`;
                secretTitle.textContent = 'Секретные';
                secretChibisBtn.style.display = 'flex';
            } else {
                secretChibisBtn.style.display = 'none';
            }
        }
        
        function createChibiCard(chibiName, isCollected, rarity) {
            const card = document.createElement('div');
            card.className = 'chibi-card';
            
            const imageUrl = `https://raw.githubusercontent.com/your-repo/main/chibis/${rarity}/${chibiName}.png`;
            
            card.innerHTML = `
                <div class="chibi-image">
                    <img src="${imageUrl}" alt="${chibiName}" style="opacity: ${isCollected ? '1' : '0.3'}">
                </div>
                <div class="chibi-name">${chibiName}</div>
                ${!isCollected ? `
                    <div class="locked-overlay">
                        <div class="lock-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="locked-text">Не получен</div>
                    </div>
                ` : ''}
            `;
            
            // Добавляем вибрацию при нажатии на карточку чибика
            card.addEventListener('click', function() {
                vibrate();
            });
            
            return card;
        }
        
        function loadCommonCollection() {
            commonChibiGrid.innerHTML = '';
            
            allCommonChibis.forEach(chibiName => {
                const isCollected = userData.collectedChibis.includes(chibiName);
                const chibiCard = createChibiCard(chibiName, isCollected, 'common');
                commonChibiGrid.appendChild(chibiCard);
            });
        }
        
        function loadSecretCollection() {
            secretChibiGrid.innerHTML = '';
            
            allSecretChibis.forEach(chibiName => {
                const isCollected = userData.secretChibis.includes(chibiName);
                const chibiCard = createChibiCard(chibiName, isCollected, 'secret');
                secretChibiGrid.appendChild(chibiCard);
            });
        }
        
        // Добавляем вибрацию при нажатии на кнопки
        commonChibisBtn.addEventListener('click', function() {
            vibrate();
            showCollectionScreen(commonCollectionScreen);
            loadCommonCollection();
        });
        
        secretChibisBtn.addEventListener('click', function() {
            vibrate();
            showCollectionScreen(secretCollectionScreen);
            loadSecretCollection();
        });
        
        // Убираем вибрацию для кнопки "Читать"
        articleLink.addEventListener('click', function(e) {
            // Не вызываем vibrate() для этой кнопки
        });
        
        async function loadChibiLists() {
            try {
                const response = await fetch('/get_all_chibis');
                const data = await response.json();
                allCommonChibis = data.common || [];
                allSecretChibis = data.secret || [];
            } catch (error) {
                console.error('Ошибка загрузки списка чибиков:', error);
            }
        }
        
        function simulateRealisticLoading() {
            const speed = 0.5 + Math.random() * 1.5;
            const shouldLag = Math.random() < 0.2;
            const lagDuration = shouldLag ? 300 + Math.random() * 700 : 0;
            
            if (shouldLag && progress > 20 && progress < 90) {
                setTimeout(() => {
                    progress += speed;
                    progressBar.style.width = progress + '%';
                    
                    if (progress < 100) {
                        setTimeout(simulateRealisticLoading, 50);
                    } else {
                        finishLoading();
                    }
                }, lagDuration);
            } else {
                progress += speed;
                progressBar.style.width = progress + '%';
                
                if (progress < 100) {
                    setTimeout(simulateRealisticLoading, 50);
                } else {
                    finishLoading();
                }
            }
        }
        
        function finishLoading() {
            saveLaunchTime(); // Сохраняем время запуска
            loadingScreen.style.opacity = '0';
            
            setTimeout(() => {
                mainScreen.style.opacity = '1';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 800);
            }, 500);
        }
        
        function skipLoading() {
            // Пропускаем загрузку, если прошло меньше 20 секунд
            loadingScreen.style.display = 'none';
            mainScreen.style.opacity = '1';
            saveLaunchTime(); // Все равно сохраняем время запуска
        }
        
        let progress = 0;
        window.onload = async function() {
            initTelegramWebApp();
            
            // Проверяем, нужно ли показывать экран загрузки
            if (shouldShowLoading()) {
                await loadChibiLists();
                await loadUserCollection();
                setTimeout(simulateRealisticLoading, 500);
            } else {
                await loadChibiLists();
                await loadUserCollection();
                skipLoading();
            }
        };
    </script>
</body>
</html>
