<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chibeki Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FFD951;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        .bot-name {
            color: white;
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 15px;
            position: absolute;
            top: calc(50% - 120px);
        }

        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 40px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }

        .loading-progress {
            position: absolute;
            height: 100%;
            width: 0%;
            background-color: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            color: white;
            opacity: 0.7;
            font-size: 14px;
        }

        .main-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 5;
            padding: 20px;
            padding-top: 105px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .main-screen::-webkit-scrollbar,
        .chibi-grid::-webkit-scrollbar {
            display: none;
        }

        .main-screen,
        .chibi-grid {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 85px;
            left: 20px;
            right: 20px;
            z-index: 6;
        }

        .main-logo {
            width: 120px;
            height: auto;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 17px;
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
        }

        .subtitle {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .item-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
        }

        .item-card:active {
            background-color: #2a2a2a;
            transform: scale(0.98);
        }

        .item-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .collection-percentage {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
        }

        .collection-count {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
        }

        .article-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .article-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            flex: 1;
        }

        .article-link {
            color: #FFD951;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid #FFD951;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .article-link:active {
            background-color: #FFD951;
            color: #000;
        }

        .collection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 8;
            padding: 20px;
            padding-top: 105px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .header-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            flex: 1;
        }

        .collection-progress {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            margin-left: 10px;
        }

        .collection-count-header {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            margin-left: 10px;
        }

        .chibi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .chibi-card {
            background-color: #1a1a1a;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            aspect-ratio: 1;
            position: relative;
            transition: transform 0.2s ease;
        }

        .chibi-card:active {
            transform: scale(0.95);
        }

        .chibi-image {
            width: 100%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .chibi-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .chibi-name {
            color: white;
            font-size: 10px;
            text-align: center;
            font-weight: 500;
            line-height: 1.2;
            margin-top: 4px;
        }

        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lock-icon {
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            margin-bottom: 5px;
        }

        .locked-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
            text-align: center;
        }

        .unknown-chibi {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .unknown-icon {
            color: rgba(255, 255, 255, 0.5);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .unknown-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 9px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="bot-name">@chibeki_bot</div>
        <img src="https://i.ibb.co/zTB331HR/image.png" alt="Логотип" class="logo">
        <div class="loading-bar">
            <div class="loading-progress" id="progress"></div>
        </div>
        <div class="footer-text">Загрузка коллекции...</div>
    </div>

    <div class="main-screen" id="mainScreen">
        <div class="header-container">
            <img src="https://i.ibb.co/zTB331HR/image.png" alt="Логотип" class="main-logo">
            <div class="user-avatar" id="userAvatar">
                TG
            </div>
        </div>
        
        <div class="subtitle">Чибики</div>
        
        <div class="item-card" id="commonChibisBtn">
            <div class="item-image">
                <img src="" alt="Обычные чибики" id="commonChibiImage">
            </div>
            <div class="item-content">
                <div class="item-title">Обычные</div>
            </div>
            <div class="collection-percentage" id="commonPercentage">0%</div>
        </div>
        
        <div class="item-card" id="secretChibisBtn">
            <div class="item-image">
                <img src="" alt="Секретные чибики" id="secretChibiImage">
            </div>
            <div class="item-content">
                <div class="item-title" id="secretTitle">???</div>
            </div>
        </div>
        
        <div class="item-card" id="prizeChibisBtn" style="display: none;">
            <div class="item-image">
                <img src="" alt="Призовые чибики" id="prizeChibiImage">
            </div>
            <div class="item-content">
                <div class="item-title">Призовые</div>
            </div>
            <div class="collection-count" id="prizeCount">x0</div>
        </div>
        
        <div class="subtitle">Статьи</div>
        
        <div class="article-card">
            <div class="article-image">
                <img src="https://i.ibb.co/sJVz9tH3/IMG-6876.png" alt="Статья">
            </div>
            <div class="article-title">Как работают кости?</div>
            <a href="https://telegra.ph/Kak-rabotayut-kosti--CHIBIKI-11-10" target="_blank" class="article-link">Читать</a>
        </div>
    </div>

    <div class="collection-screen hidden" id="commonCollectionScreen">
        <div class="header">
            <div class="header-title">
                Обычные чибики
                <span class="collection-progress" id="commonProgressText">0%</span>
            </div>
        </div>
        
        <div class="chibi-grid" id="commonChibiGrid">
        </div>
    </div>

    <div class="collection-screen hidden" id="secretCollectionScreen">
        <div class="header">
            <div class="header-title">Секретные чибики</div>
        </div>
        
        <div class="chibi-grid" id="secretChibiGrid">
        </div>
    </div>

    <div class="collection-screen hidden" id="prizeCollectionScreen">
        <div class="header">
            <div class="header-title">
                Призовые чибики
                <span class="collection-count-header" id="prizeProgressText">x0</span>
            </div>
        </div>
        
        <div class="chibi-grid" id="prizeChibiGrid">
        </div>
    </div>

    <script>
        const progressBar = document.getElementById('progress');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainScreen = document.getElementById('mainScreen');
        const userAvatar = document.getElementById('userAvatar');
        const commonChibisBtn = document.getElementById('commonChibisBtn');
        const secretChibisBtn = document.getElementById('secretChibisBtn');
        const prizeChibisBtn = document.getElementById('prizeChibisBtn');
        const commonCollectionScreen = document.getElementById('commonCollectionScreen');
        const secretCollectionScreen = document.getElementById('secretCollectionScreen');
        const prizeCollectionScreen = document.getElementById('prizeCollectionScreen');
        const commonChibiGrid = document.getElementById('commonChibiGrid');
        const secretChibiGrid = document.getElementById('secretChibiGrid');
        const prizeChibiGrid = document.getElementById('prizeChibiGrid');
        const commonChibiImage = document.getElementById('commonChibiImage');
        const secretChibiImage = document.getElementById('secretChibiImage');
        const prizeChibiImage = document.getElementById('prizeChibiImage');
        const secretTitle = document.getElementById('secretTitle');
        const commonPercentage = document.getElementById('commonPercentage');
        const prizeCount = document.getElementById('prizeCount');
        const commonProgressText = document.getElementById('commonProgressText');
        const prizeProgressText = document.getElementById('prizeProgressText');
        
        let userData = {
            collectedChibis: [],
            secretChibis: [],
            prizeChibis: []
        };
        
        let allCommonChibis = [];
        let allSecretChibis = [];
        let allPrizeChibis = [];
        
        const BOT_API_URL = 'https://chibi-bot-3d4x.onrender.com';
        
        function vibrate() {
            if (window.Telegram && window.Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }
        
        function shouldShowLoading() {
            const lastLaunch = localStorage.getItem('lastLaunchTime');
            if (!lastLaunch) return true;
            
            const currentTime = Date.now();
            const timeDiff = currentTime - parseInt(lastLaunch);
            return timeDiff > 30000;
        }
        
        function saveLaunchTime() {
            localStorage.setItem('lastLaunchTime', Date.now().toString());
        }
        
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.ready();
                
                Telegram.WebApp.expand();
                
                const user = Telegram.WebApp.initDataUnsafe.user;
                if (user) {
                    if (user.photo_url) {
                        userAvatar.innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:17px;">`;
                    }
                    
                    Telegram.WebApp.setHeaderColor('#000000');
                    Telegram.WebApp.setBackgroundColor('#000000');
                    
                    Telegram.WebApp.BackButton.onClick(handleBackButton);
                }
            }
        }
        
        function handleBackButton() {
            vibrate();
            
            if (!commonCollectionScreen.classList.contains('hidden')) {
                showMainScreen();
            } else if (!secretCollectionScreen.classList.contains('hidden')) {
                showMainScreen();
            } else if (!prizeCollectionScreen.classList.contains('hidden')) {
                showMainScreen();
            }
        }
        
        function showMainScreen() {
            commonCollectionScreen.classList.add('hidden');
            secretCollectionScreen.classList.add('hidden');
            prizeCollectionScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            mainScreen.style.opacity = '1';
            
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.BackButton.hide();
            }
        }
        
        function showCollectionScreen(screen) {
            vibrate();
            mainScreen.classList.add('hidden');
            screen.classList.remove('hidden');
            screen.style.opacity = '1';
            
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.BackButton.show();
            }
        }
        
        function calculateCollectionPercentage() {
            if (allCommonChibis.length === 0) return 0;
            const collectedCount = userData.collectedChibis.length;
            const percentage = Math.round((collectedCount / allCommonChibis.length) * 100);
            return percentage;
        }
        
        function updateCollectionProgress() {
            const percentage = calculateCollectionPercentage();
            commonPercentage.textContent = `${percentage}%`;
            commonProgressText.textContent = `${percentage}%`;
            
            if (userData.prizeChibis && userData.prizeChibis.length > 0) {
                prizeCount.textContent = `x${userData.prizeChibis.length}`;
                prizeProgressText.textContent = `x${userData.prizeChibis.length}`;
                prizeChibisBtn.style.display = 'flex';
            } else {
                prizeChibisBtn.style.display = 'none';
            }
        }
        
        async function loadUserCollection() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const user = Telegram.WebApp.initDataUnsafe.user;
                    if (user) {
                        console.log('Загрузка коллекции для пользователя:', user.id);
                        
                        const response = await fetch(`${BOT_API_URL}/get_user_collection`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ telegram_id: user.id })
                        });
                        
                        if (response.ok) {
                            const collection = await response.json();
                            console.log('Получена коллекция:', collection);
                            
                            userData.collectedChibis = collection.common || [];
                            userData.secretChibis = collection.secret || [];
                            userData.prizeChibis = collection.prize || [];
                            allCommonChibis = collection.all_common || [];
                            allSecretChibis = collection.all_secret || [];
                            allPrizeChibis = collection.all_prize || [];
                            updateMainScreenImages();
                            updateCollectionProgress();
                        } else {
                            console.error('Ошибка HTTP:', response.status);
                        }
                    }
                }
            } catch (error) {
                console.error('Ошибка загрузки коллекции:', error);
            }
        }
        
        function updateMainScreenImages() {
            if (userData.collectedChibis.length > 0) {
                const randomCommon = userData.collectedChibis[Math.floor(Math.random() * userData.collectedChibis.length)];
                const commonImageUrl = `https://raw.githubusercontent.com/therootishere00-ux/Chibi-bot/main/chibis/common/${randomCommon.replace(/ /g, '_')}.png`;
                commonChibiImage.src = commonImageUrl;
            } else {
                commonChibiImage.src = 'https://raw.githubusercontent.com/therootishere00-ux/Chibi-bot/main/chibis/common/placeholder.png';
            }
            
            if (userData.secretChibis.length > 0) {
                const randomSecret = userData.secretChibis[Math.floor(Math.random() * userData.secretChibis.length)];
                const secretImageUrl = `https://raw.githubusercontent.com/therootishere00-ux/Chibi-bot/main/chibis/secret/${randomSecret.replace(/ /g, '_')}.png`;
                secretChibiImage.src = secretImageUrl;
                secretTitle.textContent = 'Секретные';
                secretChibisBtn.style.display = 'flex';
            } else {
                secretChibisBtn.style.display = 'none';
            }
            
            if (userData.prizeChibis.length > 0) {
                const randomPrize = userData.prizeChibis[Math.floor(Math.random() * userData.prizeChibis.length)];
                const prizeImageUrl = `https://raw.githubusercontent.com/therootishere00-ux/Chibi-bot/main/chibis/prize/${randomPrize.replace(/ /g, '_')}.png`;
                prizeChibiImage.src = prizeImageUrl;
            }
        }
        
        function createChibiCard(chibiName, isCollected, rarity) {
            const card = document.createElement('div');
            card.className = 'chibi-card';
            
            if (rarity === 'secret' && !isCollected) {
                card.innerHTML = `
                    <div class="unknown-chibi">
                        <div class="unknown-icon">
                            <i class="fas fa-question"></i>
                        </div>
                        <div class="unknown-text">???</div>
                    </div>
                `;
            } else {
                const imageUrl = `https://raw.githubusercontent.com/therootishere00-ux/Chibi-bot/main/chibis/${rarity}/${chibiName.replace(/ /g, '_')}.png`;
                
                card.innerHTML = `
                    <div class="chibi-image">
                        <img src="${imageUrl}" alt="${chibiName}" style="opacity: ${isCollected ? '1' : '0.3'}" onerror="this.style.display='none'">
                    </div>
                    <div class="chibi-name">${chibiName}</div>
                    ${!isCollected ? `
                        <div class="locked-overlay">
                            <div class="lock-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <div class="locked-text">Не получен</div>
                        </div>
                    ` : ''}
                `;
            }
            
            card.addEventListener('click', function() {
                vibrate();
            });
            
            return card;
        }
        
        function loadCommonCollection() {
            commonChibiGrid.innerHTML = '';
            
            allCommonChibis.forEach(chibiName => {
                const isCollected = userData.collectedChibis.includes(chibiName);
                const chibiCard = createChibiCard(chibiName, isCollected, 'common');
                commonChibiGrid.appendChild(chibiCard);
            });
            
            updateCollectionProgress();
        }
        
        function loadSecretCollection() {
            secretChibiGrid.innerHTML = '';
            
            allSecretChibis.forEach(chibiName => {
                const isCollected = userData.secretChibis.includes(chibiName);
                const chibiCard = createChibiCard(chibiName, isCollected, 'secret');
                secretChibiGrid.appendChild(chibiCard);
            });
        }
        
        function loadPrizeCollection() {
            prizeChibiGrid.innerHTML = '';
            
            allPrizeChibis.forEach(chibiName => {
                const isCollected = userData.prizeChibis.includes(chibiName);
                const chibiCard = createChibiCard(chibiName, isCollected, 'prize');
                prizeChibiGrid.appendChild(chibiCard);
            });
            
            updateCollectionProgress();
        }
        
        commonChibisBtn.addEventListener('click', function() {
            vibrate();
            showCollectionScreen(commonCollectionScreen);
            loadCommonCollection();
        });
        
        secretChibisBtn.addEventListener('click', function() {
            vibrate();
            showCollectionScreen(secretCollectionScreen);
            loadSecretCollection();
        });
        
        prizeChibisBtn.addEventListener('click', function() {
            vibrate();
            showCollectionScreen(prizeCollectionScreen);
            loadPrizeCollection();
        });
        
        async function loadChibiLists() {
            try {
                console.log('Загрузка списков чибиков...');
                const response = await fetch(`${BOT_API_URL}/get_all_chibis`);
                if (response.ok) {
                    const data = await response.json();
                    allCommonChibis = data.common || [];
                    allSecretChibis = data.secret || [];
                    allPrizeChibis = data.prize || [];
                    console.log('Загружено обычных:', allCommonChibis.length, 'секретных:', allSecretChibis.length, 'призовых:', allPrizeChibis.length);
                } else {
                    console.error('Ошибка загрузки списков чибиков:', response.status);
                }
            } catch (error) {
                console.error('Ошибка загрузки списка чибиков:', error);
            }
        }
        
        function simulateRealisticLoading() {
            const speed = 0.5 + Math.random() * 1.5;
            const shouldLag = Math.random() < 0.2;
            const lagDuration = shouldLag ? 300 + Math.random() * 700 : 0;
            
            if (shouldLag && progress > 20 && progress < 90) {
                setTimeout(() => {
                    progress += speed;
                    progressBar.style.width = progress + '%';
                    
                    if (progress < 100) {
                        setTimeout(simulateRealisticLoading, 50);
                    } else {
                        finishLoading();
                    }
                }, lagDuration);
            } else {
                progress += speed;
                progressBar.style.width = progress + '%';
                
                if (progress < 100) {
                    setTimeout(simulateRealisticLoading, 50);
                } else {
                    finishLoading();
                }
            }
        }
        
        function finishLoading() {
            saveLaunchTime();
            loadingScreen.style.opacity = '0';
            
            setTimeout(() => {
                mainScreen.style.opacity = '1';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 800);
            }, 500);
        }
        
        function skipLoading() {
            loadingScreen.style.display = 'none';
            mainScreen.style.opacity = '1';
            saveLaunchTime();
        }
        
        let progress = 0;
        window.onload = async function() {
            console.log('Мини-приложение загружено');
            initTelegramWebApp();
            
            if (shouldShowLoading()) {
                await loadChibiLists();
                await loadUserCollection();
                setTimeout(simulateRealisticLoading, 500);
            } else {
                await loadChibiLists();
                await loadUserCollection();
                skipLoading();
            }
        };
    </script>
</body>
</html>
