<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chibeki Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FFD951;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        .bot-name {
            color: white;
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 15px;
            position: absolute;
            top: calc(50% - 120px);
        }

        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 40px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }

        .loading-progress {
            position: absolute;
            height: 100%;
            width: 0%;
            background-color: white;
            border-radius: 2px;
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            color: white;
            opacity: 0.7;
            font-size: 14px;
        }

        .main-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 5;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .user-avatar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 17px;
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
        }

        .main-logo {
            width: 120px;
            height: auto;
            margin-top: 80px;
            align-self: center;
        }

        .subtitle {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .item-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            width: calc(100% - 20px);
            box-sizing: border-box;
            margin-left: 10px;
            margin-right: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .item-card:active {
            background-color: #2a2a2a;
        }

        .item-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .item-chevron {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }

        .article-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            width: calc(100% - 20px);
            box-sizing: border-box;
            margin-left: 10px;
            margin-right: 10px;
            position: relative;
        }

        .article-image {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            flex: 1;
        }

        .article-link {
            color: #FFD951;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid #FFD951;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .article-link:hover {
            background-color: #FFD951;
            color: #000;
        }

        .collection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 8;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .back-button {
            color: white;
            font-size: 20px;
            margin-right: 15px;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }

        .back-button:active {
            background-color: #2a2a2a;
        }

        .header-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .chibi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 5px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .chibi-grid::-webkit-scrollbar {
            width: 4px;
        }

        .chibi-grid::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 2px;
        }

        .chibi-grid::-webkit-scrollbar-thumb {
            background: #FFD951;
            border-radius: 2px;
        }

        .chibi-card {
            background-color: #1a1a1a;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            aspect-ratio: 1;
            position: relative;
            transition: transform 0.2s ease;
        }

        .chibi-card:active {
            transform: scale(0.95);
        }

        .chibi-image {
            width: 100%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .chibi-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .chibi-name {
            color: white;
            font-size: 10px;
            text-align: center;
            font-weight: 500;
            line-height: 1.2;
            margin-top: 4px;
        }

        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lock-icon {
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            margin-bottom: 5px;
        }

        .locked-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .demo-notice {
            background-color: #FFD951;
            color: #000;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            border-radius: 8px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="bot-name">@chibeki_bot</div>
        
        <img src="https://i.ibb.co/zTB331HR/image.png" alt="Логотип" class="logo">
        
        <div class="loading-bar">
            <div class="loading-progress" id="progress"></div>
        </div>

        <div class="footer-text">Загрузка коллекции...</div>
    </div>

    <div class="main-screen hidden" id="mainScreen">
        <div class="user-avatar" id="userAvatar">
            TG
        </div>
        
        <img src="https://i.ibb.co/zTB331HR/image.png" alt="Логотип" class="main-logo">
        
        <div class="demo-notice" id="demoNotice">
            🔥 Демо-режим: данные загружены локально
        </div>
        
        <div class="subtitle">Чибики</div>
        
        <div class="item-card" id="commonChibisBtn">
            <div class="item-image">
                <img id="commonChibiImage" src="https://raw.githubusercontent.com/TheRootIsHere00-ux/Chibi-bot/main/chibis/common/%D0%93%D1%80%D0%B8%D1%82.png" alt="Обычные чибики">
            </div>
            <div class="item-content">
                <div class="item-title">Обычные</div>
            </div>
            <div class="item-chevron">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="item-card hidden" id="secretChibisBtn">
            <div class="item-image">
                <img id="secretChibiImage" src="" alt="Секретные чибики">
            </div>
            <div class="item-content">
                <div class="item-title">Секретные</div>
            </div>
            <div class="item-chevron">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="subtitle">Статьи</div>
        
        <div class="article-card">
            <div class="article-image">
                <img src="https://i.ibb.co/sJVz9tH3/IMG-6876.png" alt="Статья">
            </div>
            <div class="article-title">Как работают кости?</div>
            <a href="https://example.com" target="_blank" class="article-link">Читать</a>
        </div>
    </div>

    <div class="collection-screen hidden" id="commonCollectionScreen">
        <div class="header">
            <div class="back-button" id="backButtonCommon">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="header-title">Обычные чибики</div>
        </div>
        
        <div class="chibi-grid" id="commonChibiGrid">
        </div>
    </div>

    <div class="collection-screen hidden" id="secretCollectionScreen">
        <div class="header">
            <div class="back-button" id="backButtonSecret">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="header-title">Секретные чибики</div>
        </div>
        
        <div class="chibi-grid" id="secretChibiGrid">
        </div>
    </div>

    <script>
        // Запрет масштабирования и выделения
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });
        
        // Элементы
        const progressBar = document.getElementById('progress');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainScreen = document.getElementById('mainScreen');
        const userAvatar = document.getElementById('userAvatar');
        const commonChibisBtn = document.getElementById('commonChibisBtn');
        const secretChibisBtn = document.getElementById('secretChibisBtn');
        const commonCollectionScreen = document.getElementById('commonCollectionScreen');
        const secretCollectionScreen = document.getElementById('secretCollectionScreen');
        const backButtonCommon = document.getElementById('backButtonCommon');
        const backButtonSecret = document.getElementById('backButtonSecret');
        const commonChibiGrid = document.getElementById('commonChibiGrid');
        const secretChibiGrid = document.getElementById('secretChibiGrid');
        const commonChibiImage = document.getElementById('commonChibiImage');
        const secretChibiImage = document.getElementById('secretChibiImage');
        const demoNotice = document.getElementById('demoNotice');
        
        // Демо-данные пользователя
        const demoUserData = {
            collectedCommon: ['Грит', 'Таррек', 'Крилл', 'Гето', 'Дин'],
            collectedSecret: ['Секретный1'],
            allCommonChibis: ['Грит', 'Таррек', 'Крилл', 'Гето', 'Дин', 'Боксо', 'Мерин', 'Хрило', 'Гомадо', 'Грож', 'Грирт', 'Тарр'],
            allSecretChibis: ['Секретный1', 'Секретный2', 'Секретный3'],
            randomCommonChibi: 'Грит',
            firstSecretChibi: 'Секретный1',
            hasSecret: true
        };
        
        let userData = { ...demoUserData };
        let progress = 0;
        let currentScreen = 'main';
        
        // Инициализация Telegram WebApp
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    // Развернуть на весь экран
                    Telegram.WebApp.expand();
                    
                    // Получить данные пользователя
                    const user = Telegram.WebApp.initDataUnsafe.user;
                    
                    if (user) {
                        // Установить аватар
                        if (user.photo_url) {
                            userAvatar.innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:17px;">`;
                        } else {
                            const initials = user.first_name ? user.first_name.charAt(0).toUpperCase() : 'TG';
                            userAvatar.innerHTML = initials;
                        }
                        
                        // Скрыть демо-уведомление
                        demoNotice.style.display = 'none';
                        
                        // Загрузить реальные данные пользователя
                        loadUserCollection(user.id);
                        return;
                    }
                } catch (error) {
                    console.error('Ошибка инициализации Telegram:', error);
                }
            }
            
            // Демо-режим
            userAvatar.innerHTML = 'TG';
            demoNotice.style.display = 'block';
            updateMainScreen();
        }
        
        // Загрузка коллекции пользователя
        async function loadUserCollection(userId) {
            try {
                // В реальном приложении здесь будет запрос к API бота
                // const response = await fetch('https://your-bot-url.onrender.com/api/user_collection', {...});
                // userData = await response.json();
                
                // Для демо используем локальные данные
                await new Promise(resolve => setTimeout(resolve, 1000));
                userData = { ...demoUserData };
                updateMainScreen();
                
            } catch (error) {
                console.error('Ошибка загрузки коллекции:', error);
                // В случае ошибки используем демо-данные
                userData = { ...demoUserData };
                updateMainScreen();
            }
        }
        
        // Обновление главного экрана
        function updateMainScreen() {
            // Обновляем изображение обычных чибиков
            if (userData.randomCommonChibi) {
                const commonImageUrl = `https://raw.githubusercontent.com/TheRootIsHere00-ux/Chibi-bot/main/chibis/common/${encodeURIComponent(userData.randomCommonChibi)}.png`;
                commonChibiImage.src = commonImageUrl;
                commonChibiImage.onerror = function() {
                    this.src = 'https://i.ibb.co/KjF5gXV1/image.png';
                };
            }
            
            // Обновляем секретные чибики
            if (userData.hasSecret && userData.firstSecretChibi) {
                secretChibisBtn.classList.remove('hidden');
                const secretImageUrl = `https://raw.githubusercontent.com/TheRootIsHere00-ux/Chibi-bot/main/chibis/secret/${encodeURIComponent(userData.firstSecretChibi)}.png`;
                secretChibiImage.src = secretImageUrl;
                secretChibiImage.onerror = function() {
                    this.src = 'https://i.ibb.co/KjF5gXV1/image.png';
                };
            } else {
                secretChibisBtn.classList.add('hidden');
            }
        }
        
        // Создание карточки чибика
        function createChibiCard(chibiName, isCollected, chibiType) {
            const card = document.createElement('div');
            card.className = 'chibi-card';
            
            const imageUrl = `https://raw.githubusercontent.com/TheRootIsHere00-ux/Chibi-bot/main/chibis/${chibiType}/${encodeURIComponent(chibiName)}.png`;
            
            card.innerHTML = `
                <div class="chibi-image">
                    <img src="${imageUrl}" alt="${chibiName}" style="opacity: ${isCollected ? '1' : '0.3'}" 
                         onerror="this.src='https://i.ibb.co/KjF5gXV1/image.png'">
                </div>
                <div class="chibi-name">${chibiName}</div>
                ${!isCollected ? `
                    <div class="locked-overlay">
                        <div class="lock-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="locked-text">Не получен</div>
                    </div>
                ` : ''}
            `;
            
            return card;
        }
        
        // Загрузка коллекции обычных чибиков
        function loadCommonCollection() {
            commonChibiGrid.innerHTML = '';
            
            userData.allCommonChibis.forEach(chibiName => {
                const isCollected = userData.collectedCommon.includes(chibiName);
                const chibiCard = createChibiCard(chibiName, isCollected, 'common');
                commonChibiGrid.appendChild(chibiCard);
            });
        }
        
        // Загрузка коллекции секретных чибиков
        function loadSecretCollection() {
            secretChibiGrid.innerHTML = '';
            
            userData.allSecretChibis.forEach(chibiName => {
                const isCollected = userData.collectedSecret.includes(chibiName);
                const chibiCard = createChibiCard(chibiName, isCollected, 'secret');
                secretChibiGrid.appendChild(chibiCard);
            });
        }
        
        // Управление навигацией Telegram
        function updateTelegramBackButton() {
            if (window.Telegram && window.Telegram.WebApp) {
                if (currentScreen === 'main') {
                    // На главном экране - скрыть кнопку назад
                    Telegram.WebApp.BackButton.hide();
                } else {
                    // На экранах коллекции - показать кнопку назад
                    Telegram.WebApp.BackButton.show();
                }
            }
        }
        
        // Обработчики навигации
        commonChibisBtn.addEventListener('click', function() {
            mainScreen.classList.add('hidden');
            commonCollectionScreen.classList.remove('hidden');
            commonCollectionScreen.style.opacity = '1';
            currentScreen = 'common';
            updateTelegramBackButton();
            loadCommonCollection();
        });
        
        secretChibisBtn.addEventListener('click', function() {
            mainScreen.classList.add('hidden');
            secretCollectionScreen.classList.remove('hidden');
            secretCollectionScreen.style.opacity = '1';
            currentScreen = 'secret';
            updateTelegramBackButton();
            loadSecretCollection();
        });
        
        backButtonCommon.addEventListener('click', function() {
            commonCollectionScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            mainScreen.style.opacity = '1';
            currentScreen = 'main';
            updateTelegramBackButton();
        });
        
        backButtonSecret.addEventListener('click', function() {
            secretCollectionScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            mainScreen.style.opacity = '1';
            currentScreen = 'main';
            updateTelegramBackButton();
        });
        
        // Обработчик кнопки назад в Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.BackButton.onClick(function() {
                if (currentScreen === 'common') {
                    backButtonCommon.click();
                } else if (currentScreen === 'secret') {
                    backButtonSecret.click();
                }
            });
        }
        
        // Симуляция загрузки
        function simulateRealisticLoading() {
            const speed = 0.5 + Math.random() * 1.5;
            const shouldLag = Math.random() < 0.2;
            const lagDuration = shouldLag ? 300 + Math.random() * 700 : 0;
            
            if (shouldLag && progress > 20 && progress < 90) {
                setTimeout(() => {
                    progress += speed;
                    progressBar.style.width = progress + '%';
                    
                    if (progress < 100) {
                        setTimeout(simulateRealisticLoading, 50);
                    } else {
                        finishLoading();
                    }
                }, lagDuration);
            } else {
                progress += speed;
                progressBar.style.width = progress + '%';
                
                if (progress < 100) {
                    setTimeout(simulateRealisticLoading, 50);
                } else {
                    finishLoading();
                }
            }
        }
        
        // Завершение загрузки
        function finishLoading() {
            loadingScreen.style.opacity = '0';
            
            setTimeout(() => {
                // Инициализируем Telegram WebApp
                initTelegramWebApp();
                
                // Показываем главный экран
                mainScreen.classList.remove('hidden');
                mainScreen.style.opacity = '1';
                
                // Обновляем кнопку назад
                updateTelegramBackButton();
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 800);
            }, 500);
        }
        
        // Запуск при загрузке страницы
        window.onload = function() {
            setTimeout(simulateRealisticLoading, 500);
        };

        // Обработка ошибок загрузки изображений
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'IMG') {
                e.target.src = 'https://i.ibb.co/KjF5gXV1/image.png';
            }
        }, true);
    </script>
</body>
</html>
