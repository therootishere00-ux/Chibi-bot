<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chibeki</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #1F2021;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1F2021;
        }

        .hidden {
            display: none;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: #1F2021;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 0.5px solid #2A2B2C;
        }

        .logo {
            height: 32px;
            width: auto;
        }

        /* Main Screen */
        .main-screen {
            padding: 16px;
            padding-top: 68px;
            overflow-y: auto;
            height: 100vh;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
            padding: 0 8px;
            color: #FFFFFF;
        }

        .collection-card {
            background: #2A2B2C;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            transition: background-color 0.1s ease;
        }

        .collection-card:active {
            background: #353637;
        }

        .collection-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #353637;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            overflow: hidden;
        }

        .collection-icon img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 6px;
        }

        .collection-info {
            flex: 1;
        }

        .collection-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 2px;
            color: #FFFFFF;
        }

        .collection-stats {
            font-size: 14px;
            opacity: 0.7;
            color: rgba(255,255,255,0.7);
        }

        .collection-badge {
            background: #007AFF;
            color: #FFFFFF;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Collection Screen */
        .collection-screen {
            padding: 16px;
            padding-top: 68px;
            overflow-y: auto;
            height: 100vh;
        }

        .chibi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .chibi-card {
            background: #2A2B2C;
            border-radius: 14px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            transition: background-color 0.1s ease;
            position: relative;
        }

        .chibi-card:active {
            background: #353637;
        }

        .chibi-image {
            width: 60px;
            height: 60px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chibi-image img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        .chibi-name {
            font-size: 11px;
            text-align: center;
            font-weight: 500;
            line-height: 1.2;
            color: #FFFFFF;
        }

        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(42, 43, 44, 0.9);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .locked-overlay svg {
            width: 24px;
            height: 24px;
            fill: #8E8E93;
            margin-bottom: 4px;
        }

        .locked-text {
            font-size: 10px;
            color: #8E8E93;
        }

        /* Scrollbar Hidden */
        .main-screen::-webkit-scrollbar,
        .collection-screen::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <img src="https://i.ibb.co/zTB331HR/image.png" alt="Chibeki" class="logo">
    </div>

    <!-- Main Screen -->
    <div class="screen main-screen" id="mainScreen">
        <div class="section">
            <div class="section-title">Коллекции</div>
            
            <div class="collection-card" onclick="openCollection('common')">
                <div class="collection-icon" id="commonIcon">
                    <!-- Random chibi image will be loaded here -->
                </div>
                <div class="collection-info">
                    <div class="collection-name">Обычные чибики</div>
                    <div class="collection-stats" id="commonStats">Твоя шедевральная коллекция</div>
                </div>
                <div class="collection-badge" id="commonBadge">0%</div>
            </div>
            
            <div class="collection-card hidden" onclick="openCollection('secret')" id="secretCard">
                <div class="collection-icon" id="secretIcon">
                    <!-- Random chibi image will be loaded here -->
                </div>
                <div class="collection-info">
                    <div class="collection-name">Секретные чибики</div>
                    <div class="collection-stats" id="secretStats">Абсолютно секретно</div>
                </div>
                <div class="collection-badge hidden" id="secretBadge">NEW</div>
            </div>
            
            <div class="collection-card hidden" onclick="openCollection('prize')" id="prizeCard">
                <div class="collection-icon" id="prizeIcon">
                    <!-- Random chibi image will be loaded here -->
                </div>
                <div class="collection-info">
                    <div class="collection-name">Призовые чибики</div>
                    <div class="collection-stats" id="prizeStats">Твои чибики с розыгрышей</div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Статьи</div>
            
            <div class="collection-card" onclick="openArticle('dice')">
                <div class="collection-icon">
                    <svg viewBox="0 0 24 24" fill="#8E8E93">
                        <path d="M18,19V6c0-1.657-1.343-3-3-3H5C3.343,3,2,4.343,2,6v12c0,1.657,1.343,3,3,3h15 C18.895,21,18,20.105,18,19z" opacity=".35"></path>
                        <path d="M14,14H6c-0.552,0-1-0.448-1-1v0c0-0.552,0.448-1,1-1h8c0.552,0,1,0.448,1,1v0C15,13.552,14.552,14,14,14z"></path>
                        <path d="M14,18H6c-0.552,0-1-0.448-1-1v0c0-0.552,0.448-1,1-1h8c0.552,0,1,0.448,1,1v0C15,17.552,14.552,18,14,18z"></path>
                        <path d="M20,7h-2v12c0,1.105,0.895,2,2,2h0c1.105,0,2-0.895,2-2V9C22,7.895,21.105,7,20,7z"></path>
                        <path d="M13.5,7c-0.386,0-6.614,0-7,0C5.672,7,5,7.672,5,8.5S5.672,10,6.5,10c0.386,0,6.614,0,7,0c0.828,0,1.5-0.672,1.5-1.5 S14.328,7,13.5,7z"></path>
                    </svg>
                </div>
                <div class="collection-info">
                    <div class="collection-name">Что такое кости?</div>
                    <div class="collection-stats">И с чем их едят</div>
                </div>
            </div>
            
            <div class="collection-card" onclick="openArticle('help')">
                <div class="collection-icon">
                    <svg viewBox="0 0 24 24" fill="#8E8E93">
                        <path d="M18,19V6c0-1.657-1.343-3-3-3H5C3.343,3,2,4.343,2,6v12c0,1.657,1.343,3,3,3h15 C18.895,21,18,20.105,18,19z" opacity=".35"></path>
                        <path d="M14,14H6c-0.552,0-1-0.448-1-1v0c0-0.552,0.448-1,1-1h8c0.552,0,1,0.448,1,1v0C15,13.552,14.552,14,14,14z"></path>
                        <path d="M14,18H6c-0.552,0-1-0.448-1-1v0c0-0.552,0.448-1,1-1h8c0.552,0,1,0.448,1,1v0C15,17.552,14.552,18,14,18z"></path>
                        <path d="M20,7h-2v12c0,1.105,0.895,2,2,2h0c1.105,0,2-0.895,2-2V9C22,7.895,21.105,7,20,7z"></path>
                        <path d="M13.5,7c-0.386,0-6.614,0-7,0C5.672,7,5,7.672,5,8.5S5.672,10,6.5,10c0.386,0,6.614,0,7,0c0.828,0,1.5-0.672,1.5-1.5 S14.328,7,13.5,7z"></path>
                    </svg>
                </div>
                <div class="collection-info">
                    <div class="collection-name">Как получить помощь?</div>
                    <div class="collection-stats">Помощь от админов</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Collection Screens -->
    <div class="screen collection-screen hidden" id="commonCollectionScreen">
        <div class="chibi-grid" id="commonGrid"></div>
    </div>

    <div class="screen collection-screen hidden" id="secretCollectionScreen">
        <div class="chibi-grid" id="secretGrid"></div>
    </div>

    <div class="screen collection-screen hidden" id="prizeCollectionScreen">
        <div class="chibi-grid" id="prizeGrid"></div>
    </div>

    <script>
        // Telegram Web App Initialization
        const tg = window.Telegram.WebApp;
        
        // State
        let userData = {
            common: { collected: [], all: [] },
            secret: { collected: [], all: [] },
            prize: { collected: [], all: [] }
        };
        
        let currentScreen = 'main';

        // Initialize TMA
        function initTelegramApp() {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#1F2021');
            tg.setBackgroundColor('#1F2021');
            
            // Setup back button handler
            tg.BackButton.onClick(goBack);
            
            // Load user data
            loadUserData();
        }

        // Navigation
        function openCollection(type) {
            tg.HapticFeedback.impactOccurred('light');
            
            hideAllScreens();
            document.getElementById(`${type}CollectionScreen`).classList.remove('hidden');
            currentScreen = type;
            
            tg.BackButton.show();
            renderCollection(type);
        }

        function goBack() {
            tg.HapticFeedback.impactOccurred('light');
            hideAllScreens();
            document.getElementById('mainScreen').classList.remove('hidden');
            currentScreen = 'main';
            tg.BackButton.hide();
        }

        function hideAllScreens() {
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('commonCollectionScreen').classList.add('hidden');
            document.getElementById('secretCollectionScreen').classList.add('hidden');
            document.getElementById('prizeCollectionScreen').classList.add('hidden');
        }

        // Check if user has any chibis
        function hasAnyChibis() {
            return userData.common.collected.length > 0 || 
                   userData.secret.collected.length > 0 || 
                   userData.prize.collected.length > 0;
        }

        // Telegram Popup for bot launch
        function showBotAlert() {
            tg.showPopup({
                title: 'Запусти бота! 🚀',
                message: 'Чтобы начать собирать чибиков, нужно сначала запустить @chibeki_bot',
                buttons: [
                    {
                        type: 'default',
                        text: 'Запустить бота',
                        id: 'launch_bot'
                    },
                    {
                        type: 'cancel',
                        text: 'Позже',
                        id: 'later'
                    }
                ]
            }, function(buttonId) {
                if (buttonId === 'launch_bot') {
                    tg.openTelegramLink('https://t.me/chibeki_bot');
                }
            });
        }

        // Articles
        function openArticle(type) {
            tg.HapticFeedback.impactOccurred('medium');
            
            const articles = {
                dice: {
                    title: 'Что такое кости?',
                    message: 'Подробно расскажем, как работает игра в кости и как увеличить свои шансы на выигрыш.',
                    url: 'https://example.com/dice-guide'
                },
                help: {
                    title: 'Как получить помощь?',
                    message: 'Подробно расскажем, как обратиться к админам и решить любые проблемы с ботом.',
                    url: 'https://t.me/ya_admin7'
                }
            };
            
            const article = articles[type];
            
            tg.showPopup({
                title: article.title,
                message: article.message,
                buttons: [
                    {
                        type: type === 'help' ? 'destructive' : 'default',
                        text: 'Читать',
                        id: 'read'
                    },
                    {
                        type: 'cancel',
                        text: 'Отмена',
                        id: 'cancel'
                    }
                ]
            }, function(buttonId) {
                if (buttonId === 'read') {
                    tg.openLink(article.url);
                }
            });
        }

        // Data loading
        async function loadUserData() {
            try {
                const user = tg.initDataUnsafe?.user;
                
                // Always show bot alert for @ya_admin7
                if (user && user.username === 'ya_admin7') {
                    setTimeout(showBotAlert, 1000);
                }
                
                if (!user) {
                    return;
                }

                await loadChibiLists();
                await loadUserCollection(user.id);
                updateMainScreen();
                updateCollectionIcons();
                
                // Show bot alert if user has no chibis at all
                if (!hasAnyChibis() && user.username !== 'ya_admin7') {
                    setTimeout(showBotAlert, 1000);
                }
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        async function loadChibiLists() {
            try {
                // Mock data - replace with actual data from your bot
                userData.common.all = ['Chibi 1', 'Chibi 2', 'Chibi 3', 'Chibi 4', 'Chibi 5', 'Chibi 6', 'Chibi 7', 'Chibi 8', 'Chibi 9', 'Chibi 10', 'Chibi 11', 'Chibi 12'];
                userData.secret.all = ['Secret 1', 'Secret 2', 'Secret 3', 'Secret 4'];
                userData.prize.all = ['Prize 1', 'Prize 2', 'Prize 3'];
                
            } catch (error) {
                console.error('Error loading chibi lists:', error);
            }
        }

        async function loadUserCollection(telegramId) {
            try {
                const response = await fetch('https://chibi-bot-3d4x.onrender.com/get_user_collection', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ telegram_id: telegramId })
                });

                if (response.ok) {
                    const collection = await response.json();
                    
                    userData.common.collected = collection.common || [];
                    userData.secret.collected = collection.secret || [];
                    userData.prize.collected = collection.prize || [];
                    
                    if (collection.all_common) userData.common.all = collection.all_common;
                    if (collection.all_secret) userData.secret.all = collection.all_secret;
                    if (collection.all_prize) userData.prize.all = collection.all_prize;
                    
                } else {
                    throw new Error('Failed to load collection');
                }
            } catch (error) {
                console.error('Error loading user collection:', error);
                // Mock data for demo
                userData.common.collected = userData.common.all.slice(0, 4);
                userData.secret.collected = userData.secret.all.slice(0, 1);
                userData.prize.collected = userData.prize.all.slice(0, 1);
            }
        }

        // Update collection icons with random chibi images
        function updateCollectionIcons() {
            updateCollectionIcon('common');
            updateCollectionIcon('secret');
            updateCollectionIcon('prize');
        }

        function updateCollectionIcon(type) {
            const iconElement = document.getElementById(`${type}Icon`);
            const collected = userData[type].collected;
            
            if (collected.length > 0) {
                // Use random collected chibi image
                const randomChibi = collected[Math.floor(Math.random() * collected.length)];
                const imageUrl = `https://raw.githubusercontent.com/therootishere00-ux/Chibi-bot/main/chibis/${type}/${randomChibi.replace(/ /g, '_')}.png`;
                
                iconElement.innerHTML = `<img src="${imageUrl}" alt="${randomChibi}" onerror="this.style.display='none'">`;
            } else {
                // Show lock icon if no chibis collected
                iconElement.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="#8E8E93">
                        <path d="M18,21H6c-1.657,0-3-1.343-3-3v-8c0-1.657,1.343-3,3-3h12c1.657,0,3,1.343,3,3v8 C21,19.657,19.657,21,18,21z" opacity=".35"></path>
                        <path d="M8,7c0-2.209,1.791-4,4-4s4,1.791,4,4h2c0-3.314-2.686-6-6-6S6,3.686,6,7H8z"></path>
                        <path d="M12,12c-1.105,0-2,0.895-2,2s0.895,2,2,2s2-0.895,2-2S13.105,12,12,12z"></path>
                    </svg>
                `;
            }
        }

        // UI Updates
        function updateMainScreen() {
            // Update common collection
            const commonStats = document.getElementById('commonStats');
            const commonBadge = document.getElementById('commonBadge');
            const commonProgress = userData.common.all.length > 0 ? 
                Math.round((userData.common.collected.length / userData.common.all.length) * 100) : 0;
            
            commonStats.textContent = 'Твоя шедевральная коллекция';
            commonBadge.textContent = `${commonProgress}%`;
            
            // Update secret collection - show only if has secret chibis
            const secretCard = document.getElementById('secretCard');
            const secretStats = document.getElementById('secretStats');
            const secretBadge = document.getElementById('secretBadge');
            
            if (userData.secret.collected.length > 0) {
                secretCard.classList.remove('hidden');
                secretStats.textContent = 'Абсолютно секретно';
                secretBadge.classList.remove('hidden');
            } else {
                secretCard.classList.add('hidden');
            }
            
            // Update prize collection - show only if has prize chibis
            const prizeCard = document.getElementById('prizeCard');
            const prizeStats = document.getElementById('prizeStats');
            
            if (userData.prize.collected.length > 0) {
                prizeCard.classList.remove('hidden');
                prizeStats.textContent = 'Твои чибики с розыгрышей';
            } else {
                prizeCard.classList.add('hidden');
            }
        }

        function renderCollection(type) {
            const grid = document.getElementById(`${type}Grid`);
            const data = userData[type];
            
            grid.innerHTML = '';
            
            // For common collection, show all chibis (collected and locked)
            // For secret and prize collections, only show collected ones
            const chibisToShow = (type === 'secret' || type === 'prize') ? 
                data.collected : data.all;
            
            chibisToShow.forEach((chibiName) => {
                const isCollected = data.collected.includes(chibiName);
                
                const card = document.createElement('div');
                card.className = 'chibi-card';
                card.onclick = () => tg.HapticFeedback.impactOccurred('light');
                
                const imageUrl = `https://raw.githubusercontent.com/therootishere00-ux/Chibi-bot/main/chibis/${type}/${chibiName.replace(/ /g, '_')}.png`;
                
                card.innerHTML = `
                    <div class="chibi-image">
                        <img src="${imageUrl}" alt="${chibiName}" 
                             onerror="this.style.display='none'">
                    </div>
                    <div class="chibi-name">${chibiName}</div>
                `;
                
                // Add lock overlay only for uncollected chibis in common collection
                if (!isCollected && type === 'common') {
                    const lockOverlay = document.createElement('div');
                    lockOverlay.className = 'locked-overlay';
                    lockOverlay.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M18,21H6c-1.657,0-3-1.343-3-3v-8c0-1.657,1.343-3,3-3h12c1.657,0,3,1.343,3,3v8 C21,19.657,19.657,21,18,21z" opacity=".35"></path>
                            <path d="M8,7c0-2.209,1.791-4,4-4s4,1.791,4,4h2c0-3.314-2.686-6-6-6S6,3.686,6,7H8z"></path>
                            <path d="M12,12c-1.105,0-2,0.895-2,2s0.895,2,2,2s2-0.895,2-2S13.105,12,12,12z"></path>
                        </svg>
                        <div class="locked-text">Заблокировано</div>
                    `;
                    card.appendChild(lockOverlay);
                }
                
                grid.appendChild(card);
            });
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', initTelegramApp);
    </script>
</body>
</html>
